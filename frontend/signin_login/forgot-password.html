
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Octo Buddy</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #47DEB1 0%, #0C6478 100%);
            font-family: 'Inter', sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-top: 0;
            color: #0C6478;
            font-size: 27px;
            text-align: center;
        }

        .description {
            color: #555;
            text-align: center;
            line-height: 1.6;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #47DEB1;
            border-color: #0C6478;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(to right, #82EE99, #1EA17A);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #0C6478;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <main class="reset-card">
        <h1>Reset Password</h1>

        <p class="description">
            Enter your registered email address. We will send you
            a code to reset your Octo Buddy password.
        </p>

        <form id="requestForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                autocomplete="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit" id="sendButton">
                Send Reset Code
            </button>
        </form>

        <form id="resetForm" hidden>
            <label for="code">Five-Digit Reset Code</label>
            <input
                type="text"
                id="code"
                inputmode="numeric"
                pattern="[0-9]{5}"
                maxlength="5"
                placeholder="Enter the code from your email"
                required
            >

            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                minlength="8"
                maxlength="10"
                autocomplete="new-password"
                placeholder="8–10 characters, at least one number"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                minlength="8"
                maxlength="10"
                autocomplete="new-password"
                placeholder="Enter your new password again"
                required
            >

            <button type="submit" id="resetButton">
                Reset Password
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a class="back-link" href=../signin_login/project.html>
            Back to Login
        </a>
    </main>

    <script>
        const API_URL = "https://studybuddy-bl8d.onrender.com/api";

        const requestForm = document.getElementById("requestForm");
        const resetForm = document.getElementById("resetForm");
        const emailInput = document.getElementById("email");
        const message = document.getElementById("message");
        const sendButton = document.getElementById("sendButton");
        const resetButton = document.getElementById("resetButton");

        function showMessage(text, success = false) {
            message.textContent = text;
            message.style.color = success ? "#087F5B" : "#C62828";
        }

        async function postJSON(endpoint, body) {
            const response = await fetch(`${API_URL}/${endpoint}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            const data = await response.json();
            return { response, data };
        }

        requestForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = emailInput.value.trim();

            sendButton.disabled = true;
            showMessage("Requesting reset code...", true);

            try {
                const { response, data } = await postJSON(
                    "forgot-password",
                    { email }
                );

                if (!response.ok || data.status !== "success") {
                    showMessage(data.message || "Could not request a reset code.");
                    return;
                }

                emailInput.readOnly = true;
                resetForm.hidden = false;

                showMessage(
                    "If an eligible account exists, a reset code has been sent. " +
                    "Check your email and enter the code below. It expires in 10 minutes.",
                    true
                );

            } catch (error) {
                console.error("Reset code request failed:", error);
                showMessage("Could not connect to the server. Please try again.");
            } finally {
                sendButton.disabled = false;
            }
        });

        resetForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            const code = document.getElementById("code").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                showMessage("Your passwords do not match.");
                return;
            }

            if (!/^(?=.*\d).{8,10}$/.test(newPassword)) {
                showMessage(
                    "Your password must be 8–10 characters and contain at least one number."
                );
                return;
            }

            resetButton.disabled = true;
            showMessage("Resetting your password...", true);

            try {
                const { response, data } = await postJSON(
                    "reset-password",
                    {
                        email,
                        code,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    }
                );

                if (!response.ok || data.status !== "success") {
                    showMessage(data.message || "Password reset failed.");
                    return;
                }

                requestForm.hidden = true;
                resetForm.hidden = true;

                showMessage(
                    "Your password has been reset successfully. You can now log in using your new password.",
                    true
                );

            } catch (error) {
                console.error("Password reset failed:", error);
                showMessage("Could not connect to the server. Please try again.");
            } finally {
                resetButton.disabled = false;
            }
        });
    </script>

<script>
/* Octo Buddy API session helper: attaches the signed login token to protected API calls. */
(() => {
  if (window.__octoFetchWrapped) return;
  window.__octoFetchWrapped = true;
  const originalFetch = window.fetch.bind(window);
  window.fetch = (input, init = {}) => {
    const url = typeof input === "string" ? input : (input && input.url) || "";
    if (!url.includes("/api/")) return originalFetch(input, init);
    const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
    const token = localStorage.getItem("auth_token");
    if (token && !headers.has("Authorization")) headers.set("Authorization", `Bearer ${token}`);
    return originalFetch(input, { ...init, headers });
  };
})();
</script>
</body>
</html>
