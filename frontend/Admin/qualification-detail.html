<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qualification Details | Octo Buddy</title><link rel="stylesheet" href="detail-pages.css"></head><body><main class="shell"><div class="top"><div><div class="eyebrow">Administrator workspace</div><h1>Qualification details</h1></div><a class="back" href="admin.html">← Back to Admin</a></div><section class="panel"><p id="message" class="muted">Loading qualification…</p><div id="summary" class="grid"></div><h2>Modules in this qualification</h2><p class="muted">Modules are grouped by academic year. You can add a module here without a pop-up.</p><form id="addModule" class="grid"><div class="field"><label for="moduleName">Module name</label><input id="moduleName" required maxlength="150" placeholder="e.g. Programming 621"></div><div class="field"><label for="moduleYear">Academic year</label><select id="moduleYear"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="wide"><button class="primary">Add module</button></div></form><div id="modules"></div><div class="field" style="margin-top:20px"><label for="newName">Qualification name</label><input id="newName" maxlength="150"><button id="saveName" type="button" style="margin-top:12px">Save qualification name</button></div></section></main><script src="qualification-detail.js"></script></body></html>
