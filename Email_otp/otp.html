<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification | Octo Buddy</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(
                180deg,
                #000000 0%,
                #0C6478 80%
            );
            padding:20px;
        }

        .container{
            width:100%;
            max-width:420px;
            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
        }

        .logo{
            width:340px;
            max-width:70%;
            margin-bottom:60px;
        }

        h2{
            color:#fff;
            font-size:1.1rem;
            font-weight:400;
            margin-bottom:20px;
        }

        form{
            width:100%;
        }

        .otp-box{
            width:100%;
            height:55px;
            border:none;
            outline:none;
            border-radius:10px;
            background:#D9D9D9;
            text-align:center;
            font-size:22px;
            letter-spacing:10px;
            margin-bottom:25px;
        }

        .verify-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:10px;
            background:linear-gradient(
                90deg,
                #82EE99 0%,
                #1EA17A 100%
            );
            color:white;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            transition:.25s;
        }

        .verify-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 18px rgba(0,0,0,.25);
        }

        .verify-btn:active{
            transform:scale(.98);
        }

        .bottom{
            margin-top:30px;
            color:white;
            font-size:14px;
        }

        .bottom a{
            color:#82EE99;
            text-decoration:none;
            font-weight:600;
        }

        .bottom a:hover{
            text-decoration:underline;
        }

        /* Mobile */
        @media(max-width:480px){
            .logo{
                width:180px;
                margin-bottom:45px;
            }
            h2{
                font-size:1rem;
            }
            .otp-box{
                height:50px;
                font-size:20px;
                letter-spacing:8px;
            }
            .verify-btn{
                height:50px;
            }
        }
    </style> 
</head>
<body>

<div class="container">

    <img src="../frontend/LOGIN.png" class="logo" alt="Octo Buddy Logo">

    <!-- FORM WITH ONSUBMIT EVENT -->
    <form onsubmit="handleVerify(event)">

        <h2>Enter 5 digit code sent to your email</h2>

        <!-- INPUT WITH ID="otpInput" -->
        <input
            type="text"
            id="otpInput"
            name="otp"
            maxlength="5"
            pattern="[0-9]{5}"
            class="otp-box"
            placeholder="_____"
            required
        >

        <button type="submit" class="verify-btn">
            Verify Code
        </button>

    </form>

    <div class="bottom">
        Didn't receive code?<br>
        <a href="#" onclick="alert('Check your Flask terminal output or the registration alert for the code!')">
            Press Here
        </a>
    </div>

</div>

<script>
    async function handleVerify(event) {
        event.preventDefault();
        const otp = document.getElementById('otpInput').value.trim();
        const email = localStorage.getItem('pending_email');

        if (!email) {
            alert("No registration session found. Please register again.");
            window.location.href = "../frontend/signin_login/project.html";
            return;
        }

        try {
            const response = await fetch('http://127.0.0.1:5000/api/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, otp: otp })
            });

            const data = await response.json();

            if (response.ok && data.status === 'success') {
                alert("Account verified successfully! You can now log in.");
                localStorage.removeItem('pending_email');
                window.location.href = "../frontend/signin_login/project.html"; // Redirect back to login screen
            } else {
                alert(data.message || "Invalid OTP");
            }
        } catch (error) {
            console.error("OTP Error:", error);
            alert("Could not connect to the server.");
        }
    }
</script>

</body>
</html>
